$schema: https://json.schemastore.org/lefthook.json

pre-commit:
  parallel: true
  commands:
    lint:
      run: nub run lint:check
    type-check:
      run: nub run type-check
    format:
      run: nub run format:check

commit-msg:
  commands:
    commitlint:
      run: nub run commitlint --edit {1}
