# Required validation precedes serialized deployment on protected main. One immutable artifact contains the
# frontend and both backend Worker bundles, with content hashes checked again before stage deployment.
# Pins: Node image digest, Node/Nub versions, Nub archive SHA-256, and the locked browser tooling.
# Stage credentials MUST be protected and environment-scoped to stage; no shared writable caches.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

stages:
  - verify
  - deploy-stage

include:
  - local: scripts/deploy/ci-bootstrap.yml

quality:
  stage: verify
  timeout: 5m
  script:
    - nub run type-check
    - nub run lint:check
    - nub run format:check
    - nub run db:check

unit-tests:
  stage: verify
  timeout: 5m
  script:
    # Native alarm guards start first; other alarm paths use a test-only clock with real workerd delivery.
    - nub run test --maxWorkers=4

build-smoke:
  stage: verify
  timeout: 10m
  variables:
    NUXT_BUILD_COMMIT_SHA: '$CI_COMMIT_SHA'
    NUXT_BUILD_REPOSITORY_URL: '$CI_PROJECT_URL'
  script:
    - nub run build
    - nub run build:identity
  artifacts:
    access: maintainer
    expire_in: 7 days
    paths:
      - .output/

# Separate job: it runs on its own copy of .output, so smoke writes cannot reach the published artifact.
smoke:preview:
  stage: verify
  timeout: 5m
  needs:
    - job: build-smoke
  script:
    - export NUXT_PUBLIC_SITE_URL='http://localhost:5273'
    - printf '%s\n' 'AI_BRIEFING_ENDPOINT="http://127.0.0.1:8787/v1/chat/completions"' 'AI_BRIEFING_API_KEY="local-fixture-key"' 'AI_BRIEFING_MODEL="local-fixture-model"' > workers/briefing/.dev.vars
    - nub run smoke:preview

.stage-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"
    - when: never

stage:delivery:
  extends: .stage-main
  inherit:
    default: false
    variables: false
  stage: deploy-stage
  # The child jobs must not acquire this lock themselves: it spans deployment AND both browser checks.
  resource_group: stage
  interruptible: false
  variables:
    PARENT_PIPELINE_ID: '$CI_PIPELINE_ID'
  trigger:
    include:
      - local: scripts/deploy/ci-stage.yml
    strategy: mirror
    forward:
      yaml_variables: true
      pipeline_variables: false
