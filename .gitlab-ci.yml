# Every protected-main revision is checked and serialized through stage before a maintainer may create a release tag.
# Production deploys only that pipeline's verified artifacts and immutable protected-tag receipt.
# Pins: Node image digest, Node/Nub versions, Nub archive SHA-256, and the locked browser tooling.
# Runtime credentials use exact stage, production, or release-tag environment scopes.
stages:
  - verify
  - deploy-stage
  - tag-release
  - deploy-production

include:
  - local: scripts/deploy/ci-bootstrap.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: never

quality:
  stage: verify
  timeout: 5m
  script:
    - nub run type-check
    - nub run lint:check
    - nub run format:check
    - nub run db:check

unit-tests:
  stage: verify
  timeout: 5m
  script:
    # Native alarm guards start first; other alarm paths use a test-only clock with real workerd delivery.
    - nub run test --maxWorkers=4

build-smoke:
  stage: verify
  timeout: 10m
  variables:
    NUXT_BUILD_COMMIT_SHA: '$CI_COMMIT_SHA'
    NUXT_BUILD_REPOSITORY_URL: '$CI_PROJECT_URL'
  script:
    - nub run build
    - nub run build:identity
  artifacts:
    access: maintainer
    expire_in: 7 days
    paths:
      - .output/

# Separate job: it runs on its own copy of .output, so smoke writes cannot reach the published artifact.
smoke:built:
  stage: verify
  timeout: 5m
  needs:
    - job: build-smoke
  script:
    - export NUXT_PUBLIC_SITE_URL='http://localhost:5273'
    - printf '%s\n' 'AI_BRIEFING_ENDPOINT="http://127.0.0.1:8787/v1/chat/completions"' 'AI_BRIEFING_API_KEY="local-fixture-key"' 'AI_BRIEFING_MODEL="local-fixture-model"' > workers/briefing/.dev.vars
    - nub run smoke:built

.stage-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"
    - when: never

stage:delivery:
  extends: .stage-main
  inherit:
    default: false
    variables: false
  stage: deploy-stage
  # The child jobs must not acquire this lock themselves: it spans deployment AND both browser checks.
  resource_group: stage
  interruptible: false
  variables:
    PARENT_PIPELINE_ID: '$CI_PIPELINE_ID'
  trigger:
    include:
      - local: scripts/deploy/ci-stage.yml
    strategy: mirror
    forward:
      yaml_variables: true
      pipeline_variables: false
release:tag:
  stage: tag-release
  timeout: 10m
  inputs:
    version:
      type: string
      # GitLab requires a default; empty is rejected by the release CLI before publication.
      # https://docs.gitlab.com/ci/jobs/job_inputs/#define-and-use-job-inputs
      default: ''
      description: Enter a stable MAJOR.MINOR.PATCH version; leaving it empty refuses release
      regex: '^((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))?$'
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
    - when: never
  needs:
    - job: build-smoke
      artifacts: true
    - job: stage:delivery
      artifacts: false
  resource_group: release-tag
  interruptible: false
  environment:
    name: release-tag
    action: prepare
  script:
    - export RELEASE_VERSION='${{ job.inputs.version }}'
    - nub run release:tag
  artifacts:
    when: always
    access: maintainer
    expire_in: 30 days
    paths:
      - .data/production-release/tag.json

production:delivery:
  stage: deploy-production
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  needs:
    - job: release:tag
      artifacts: false
  inherit:
    default: false
    variables: false
  resource_group: production
  interruptible: false
  variables:
    PARENT_PIPELINE_ID: '$CI_PIPELINE_ID'
  trigger:
    include:
      - local: scripts/deploy/ci-production.yml
    strategy: mirror
    forward:
      yaml_variables: true
      pipeline_variables: false
